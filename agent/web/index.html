<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Emma prototype</title>
    <meta name="description" content="Prototype of the Emma product." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="preload" href="fonts/ProtoGrotesk.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var theme = localStorage.getItem("ids-theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="css/tokens/palette.css" />
    <link rel="stylesheet" href="css/tokens/colors.css" />
    <link rel="stylesheet" href="css/tokens/scales.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/page-composition/layout.css" />
    <link rel="stylesheet" href="css/components/ids.css" />
    <link rel="stylesheet" href="css/components/theme-toggle.css" />
    <link rel="stylesheet" href="css/project.css" />
  </head>

  <body class="ids">
    <div id="emma-glow" class="emma__glow" aria-hidden="true"></div>

    <button class="ids__theme-toggle" role="switch" aria-checked="false" aria-label="Dark theme">
      <span class="ids__theme-toggle__track"><span class="ids__theme-toggle__thumb"></span></span>
    </button>

    <main class="emma">
      <section class="emma__settings" aria-label="Settings">
        <h1 class="S">Emma</h1>
        <select id="emma-model" class="emma__control" aria-label="Model" required></select>
        <select id="emma-character" class="emma__control" aria-label="Character" required></select>
        <select id="emma-voice" class="emma__control" aria-label="Voice" required></select>
        <textarea
          id="emma-prompt"
          class="emma__control emma__prompt"
          aria-label="Note for this conversation"
          placeholder="Note for this conversation, e.g. speak in rhymes"
        ></textarea>

        <div class="emma__log-title">Events</div>
        <div id="emma-log" class="emma__log" aria-label="Event log"></div>
      </section>

      <section class="emma__center" aria-label="Talk">
        <div id="emma-stage" class="emma__stage" data-state="off">
          <div class="emma__talk">
            <div id="emma-mood" class="emma__mood" aria-live="polite" hidden></div>
            <div class="emma__orb" aria-hidden="true">
              <span class="emma__orb-mark">!</span>
              <span class="emma__orb-dots"><i></i><i></i><i></i></span>
              <span class="emma__orb-bars"><i></i><i></i><i></i><i></i><i></i></span>
            </div>
          </div>
          <div id="emma-state" class="emma__state" aria-live="polite"></div>
          <p id="emma-status" class="emma-status" aria-live="polite"></p>

          <button id="emma-talk-button" class="emma-talk-button">Talk to Emma</button>

          <div class="emma__talk-details">
            <ul id="emma-health" class="emma__health" aria-label="Conversation health" hidden>
              <li id="emma-health-mic" class="emma__health-row" data-level="off">
                <span class="emma__dot" aria-hidden="true"></span>
                <span class="emma__health-label">Microphone</span>
                <span class="emma__health-value">
                  <span class="emma__meter" aria-hidden="true"><span id="emma-mic-meter" class="emma__meter-fill"></span></span>
                  <span class="emma__health-text"></span>
                </span>
                <button id="emma-mic-toggle" class="emma__health-action" hidden>Mute</button>
              </li>
              <li id="emma-health-net" class="emma__health-row" data-level="off">
                <span class="emma__dot" aria-hidden="true"></span>
                <span class="emma__health-label">Connection</span>
                <span class="emma__health-value"><span class="emma__health-text"></span></span>
              </li>
              <li id="emma-health-emma" class="emma__health-row" data-level="off">
                <span class="emma__dot" aria-hidden="true"></span>
                <span class="emma__health-label">Emma</span>
                <span class="emma__health-value"><span class="emma__health-text"></span></span>
              </li>
              <li id="emma-health-velma" class="emma__health-row" data-level="off">
                <span class="emma__dot" aria-hidden="true"></span>
                <span class="emma__health-label">Velma</span>
                <span class="emma__health-value"><span class="emma__health-text"></span></span>
              </li>
            </ul>

            <button id="emma-sound-button" class="emma__health-action emma__sound-button" hidden>Turn on sound</button>
            <p id="emma-dev" class="emma__dev" hidden>
              Test a signal:
              <button class="emma__health-action" data-mood="angry">angry</button>
              ·
              <button class="emma__health-action" data-mood="disgusted">disgusted</button>
              ·
              <button class="emma__health-action" data-mood="afraid">afraid</button>
              ·
              <button class="emma__health-action" data-mood="surprised">surprised</button>
              ·
              <button class="emma__health-action" data-mood="happy">happy</button>
              ·
              <button class="emma__health-action" data-mood="sad">sad</button>
            </p>
          </div>
        </div>
      </section>

      <section class="emma__side">
        <div id="emma-transcript" class="emma__scroll" aria-label="Conversation"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script>
    <script src="js/theme-toggle.js"></script>
    <script src="js/emma-connect.js"></script>
  </body>
</html>
