<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Emma prototype</title>
    <meta name="description" content="Prototype of the Emma product." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="preload" href="fonts/ProtoGrotesk.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var theme = localStorage.getItem("ids-theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="css/tokens/palette.css" />
    <link rel="stylesheet" href="css/tokens/colors.css" />
    <link rel="stylesheet" href="css/tokens/scales.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/page-composition/layout.css" />
    <link rel="stylesheet" href="css/components/ids.css" />
    <link rel="stylesheet" href="css/components/theme-toggle.css" />
    <link rel="stylesheet" href="css/project.css" />
  </head>

  <body class="ids">
    <div id="emma-glow" class="emma__glow" aria-hidden="true"></div>

    <button class="ids__theme-toggle" role="switch" aria-checked="false" aria-label="Dark theme">
      <span class="ids__theme-toggle__track"><span class="ids__theme-toggle__thumb"></span></span>
    </button>

    <main class="emma">
      <section class="emma__settings" aria-label="Settings">
        <h1 class="S">Emma</h1>
        <select id="emma-model" class="emma__control" aria-label="Model" required></select>
        <select id="emma-character" class="emma__control" aria-label="Character" required></select>
        <select id="emma-voice" class="emma__control" aria-label="Voice" required></select>
        <textarea
          id="emma-prompt"
          class="emma__control emma__prompt"
          aria-label="Note for this conversation"
          placeholder="Note for this conversation, e.g. speak in rhymes"
        ></textarea>
      </section>

      <section class="emma__center" aria-label="Talk">
        <button id="emma-talk-button" class="emma-talk-button">Talk to Emma</button>
        <p id="emma-status" class="emma-status" aria-live="polite"></p>
      </section>

      <section class="emma__side">
        <div id="emma-signals" class="emma__scroll" aria-label="What Emma notices"></div>
        <div id="emma-transcript" class="emma__scroll emma__transcript" aria-label="Conversation"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script>
    <script src="js/theme-toggle.js"></script>
    <script src="js/emma-connect.js"></script>
  </body>
</html>
