<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Emma prototype</title>
    <meta name="description" content="Prototype of the Emma product." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <link rel="preload" href="../fonts/ProtoGrotesk.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var theme = localStorage.getItem("ids-theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="../css/tokens/palette.css" />
    <link rel="stylesheet" href="../css/tokens/colors.css" />
    <link rel="stylesheet" href="../css/tokens/scales.css" />
    <link rel="stylesheet" href="../css/settings.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/page-composition/layout.css" />
    <link rel="stylesheet" href="../css/components/ids.css" />
    <link rel="stylesheet" href="../css/components/theme-toggle.css" />
    <link rel="stylesheet" href="../css/project.css" />
  </head>

  <body class="ids">
    <header>
      <button class="ids__theme-toggle" role="switch" aria-checked="false" aria-label="Dark theme">
        <span class="ids__theme-toggle__track"><span class="ids__theme-toggle__thumb"></span></span>
      </button>
      <nav class="lang-switcher" aria-label="Language">
        <a href="../">RU</a>
        <a href="./" aria-current="page">EN</a>
      </nav>
    </header>

    <main class="emma">
      <section class="emma__panel emma__settings" aria-label="Settings">
        <div>
          <h1 class="S">Emma</h1>
          <p class="emma__caption">Voice prototype</p>
        </div>

        <label class="emma__field">
          <span>Model</span>
          <select id="emma-model"></select>
        </label>
        <label class="emma__field">
          <span>Character</span>
          <select id="emma-character"></select>
        </label>
        <label class="emma__field">
          <span>Voice</span>
          <select id="emma-voice"></select>
        </label>
        <label class="emma__field emma__field--grow">
          <span>Note for this conversation</span>
          <textarea id="emma-prompt" placeholder="For example: speak in rhymes"></textarea>
        </label>

        <button id="emma-talk-button" class="emma-talk-button">Talk to Emma</button>
        <p id="emma-status" class="emma-status" aria-live="polite"></p>
        <p class="emma__back"><a href="https://novanikita.github.io/Emma/en/">Research library</a></p>
      </section>

      <section class="emma__panel" aria-label="Conversation">
        <h2 class="XS">Conversation</h2>
        <div id="emma-transcript" class="emma__scroll"></div>
      </section>

      <section class="emma__panel" aria-label="What Emma notices">
        <h2 class="XS">What Emma notices</h2>
        <div id="emma-signals" class="emma__scroll"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script>
    <script src="../js/theme-toggle.js"></script>
    <script src="../js/emma-connect.js"></script>
  </body>
</html>
